<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel de Comercios — Sistema JK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; min-height: 100vh; color: #e9f8f6; background: radial-gradient(circle at top left, #12353a 0%, #0d1117 40%, #090b10 100%); padding: 24px; }
.admin-container { width: 100%; max-width: 1280px; margin: 0 auto; }
.admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.admin-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.admin-logo { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #12d8c4, #22f5dd); color: #081014; font-size: 18px; font-weight: 700; letter-spacing: .04em; flex-shrink: 0; box-shadow: 0 0 24px rgba(18,216,196,.3); }
.admin-brand h2 { font-size: 22px; font-weight: 600; color: #ffffff; letter-spacing: .02em; }
.admin-brand span { color: #7b9c99; font-size: 12px; }
.admin-btn { height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(18,216,196,.35); background: rgba(18,216,196,.10); color: #12d8c4; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: .2s; }
.admin-btn:hover { background: rgba(18,216,196,.22); }
.admin-btn:disabled { opacity: .6; cursor: not-allowed; }

.admin-warn i { color: #ffb84d; font-size: 15px; flex-shrink: 0; }
.admin-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.admin-kpi { padding: 10px 14px; border-radius: 12px; background: #171a21; border: 1px solid rgba(18,216,196,.14); display: flex; flex-direction: column; gap: 2px; }
.admin-kpi span { color: #7b9c99; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.admin-kpi strong { color: #fff; font-size: 18px; font-weight: 700; font-family: 'Poppins', sans-serif; line-height: 1.2; }
.admin-kpi small { color: #596170; font-size: 9px; }
.admin-kpi.k-blocked { border-color: rgba(255,94,94,.3); }
.admin-kpi.k-blocked strong { color: #ff8d8d; }
.admin-kpi.k-active { border-color: rgba(34,197,94,.25); }
.admin-kpi.k-active strong { color: #34d399; }
.admin-toolbar { margin-bottom: 16px; }
.admin-search { position: relative; display: block; }
.admin-search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #12d8c4; font-size: 14px; }
.admin-search input { width: 100%; height: 50px; border: 1px solid rgba(18,216,196,.2); outline: none; border-radius: 13px; background: #171a21; color: #fff; padding: 0 16px 0 46px; font-family: 'Poppins', sans-serif; font-size: 14px; transition: .2s; }
.admin-search input:focus { border-color: #12d8c4; box-shadow: 0 0 14px rgba(18,216,196,.12); }
.admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.admin-card { background: #171a21; border: 1px solid rgba(18,216,196,.14); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; transition: border-color .25s, transform .25s; height: 100%; }
.admin-card:hover { border-color: rgba(18,216,196,.35); transform: translateY(-2px); }
.admin-card-head { display: flex; align-items: center; gap: 14px; }
.admin-logo { width: 62px; height: 62px; border-radius: 14px; background: #101319; border: 1px solid rgba(18,216,196,.2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.admin-logo img { width: 100%; height: 100%; object-fit: contain; }
.admin-logo span { font-size: 22px; font-weight: 700; color: #12d8c4; font-family: 'Poppins', sans-serif; }
.admin-card-title { min-width: 0; }
.admin-card-title strong { display: block; font-size: 16px; font-weight: 600; color: #fff; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-card-title small { display: block; color: #7b9c99; font-size: 10.5px; margin-top: 3px; font-family: 'Poppins', sans-serif; letter-spacing: .04em; }
.admin-status { display: inline-block; margin-top: 7px; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: 1px solid; }
.admin-status.active { color: #34d399; border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }
.admin-status.blocked { color: #ff8d8d; border-color: rgba(255,94,94,.4); background: rgba(255,94,94,.12); }
.admin-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.admin-stat { flex: 1; min-width: 90px; background: #101319; border: 1px solid rgba(255,255,255,.04); border-radius: 10px; padding: 10px 12px; text-align: center; }
.admin-stat span { display: block; color: #7b9c99; font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
.admin-stat strong { display: block; color: #fff; font-size: 16px; font-weight: 700; margin-top: 4px; font-family: 'Poppins', sans-serif; }
.admin-password-row { display: flex; gap: 8px; align-items: center; background: #101319; border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 8px 12px; }
.admin-password-row input { flex: 1; height: 32px; border: 0; background: transparent; color: #12d8c4; font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif; letter-spacing: .05em; outline: none; min-width: 0; }
.admin-eye { background: transparent; border: 0; color: #12d8c4; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; flex-shrink: 0; }
.admin-eye:hover { background: rgba(18,216,196,.12); }
.admin-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: #596170; font-size: 10.5px; }
.admin-block-btn { height: 44px; border-radius: 12px; border: 1px solid; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; margin-top: auto; }
.admin-block-btn.block { background: rgba(255,94,94,.12); border-color: rgba(255,94,94,.35); color: #ff8d8d; }

.admin-block-btn.unblock { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.35); color: #34d399; }
.admin-block-btn.unblock:hover { background: rgba(34,197,94,.22); }
.admin-block-btn:disabled { opacity: .6; cursor: not-allowed; }
.admin-foot { margin-top: 22px; text-align: center; color: #596170; font-size: 11px; line-height: 1.7; }
.admin-loading { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #7b9c99; }
.admin-loading i { font-size: 26px; color: #12d8c4; animation: adminSpin 1s linear infinite; }
@keyframes adminSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.admin-empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: #7b9c99; border: 1px dashed rgba(18,216,196,.22); border-radius: 16px; }
.admin-empty i { font-size: 36px; display: block; margin-bottom: 10px; opacity: .5; }
@media (max-width: 1024px) {
    .admin-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
    .admin-summary { grid-template-columns: 1fr 1fr; }
    .admin-header { gap: 12px; }
    .admin-brand h2 { font-size: 18px; }

.admin-alert-container { position: fixed; top: 25px; left: 0; right: 0; width: 320px; max-width: 90vw; margin: 0 auto; z-index: 9999999; background: #171a21; border: 2px solid #12d8c4; border-radius: 14px; padding: 16px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.85); text-align: center; display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
.admin-alert-container.error { border-color: #ff5e5e; }
.admin-alert-container i { font-size: 22px; color: #12d8c4; }
.admin-alert-container.error i { color: #ff5e5e; }
.admin-alert-container p { flex: 1; color: #fff; font-weight: 600; line-height: 1.5; text-align: left; }
@media (max-width: 720px) {
    body { padding: 14px; }
}
/* ===== Panel de estadísticas de la plataforma ===== */
.admin-stats-panel { background: #171a21; border: 1px solid rgba(18,216,196,.14); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
.admin-stats-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-stats-head h3 { font-size: 14px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.admin-stats-head h3 i { color: #12d8c4; }
.admin-stats-head span { color: #7b9c99; font-size: 10.5px; }
.admin-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.admin-stat-item { background: #101319; border: 1px solid rgba(255,255,255,.04); border-radius: 10px; padding: 10px 12px; text-align: center; }
.admin-stat-item span { display: block; color: #7b9c99; font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
.admin-stat-item strong { display: block; color: #fff; font-size: 15px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-stat-item small { display: block; color: #596170; font-size: 9.5px; margin-top: 2px; }
.admin-chart-title { color: #7b9c99; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; margin: 16px 0 8px; }
.admin-chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; background: #101319; border: 1px solid rgba(255,255,255,.04); border-radius: 10px; padding: 10px 12px; }
.admin-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.admin-chart-bar { width: 100%; max-width: 34px; min-height: 3px; background: linear-gradient(180deg, #22f5dd, #12d8c4); border-radius: 5px 5px 2px 2px; }
.admin-chart-col small { color: #7b9c99; font-size: 9px; text-transform: capitalize; }
.admin-chart-col span { color: #fff; font-size: 10px; font-weight: 700; }
.admin-types-row { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-type-chip { background: #101319; border: 1px solid rgba(18,216,196,.18); color: #e9f8f6; border-radius: 20px; padding: 5px 12px; font-size: 11px; }
.admin-type-chip b { color: #12d8c4; }
@media (max-width: 900px) {
    .admin-stats-grid { grid-template-columns: repeat(2, 1fr); }
}
/* ===== Botón WhatsApp / teléfono ===== */
.admin-phone-row { display: flex; }
.admin-wa-btn { flex: 1; height: 40px; border-radius: 10px; border: 1px solid rgba(37,211,102,.45); background: rgba(37,211,102,.12); color: #4be07f; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: .2s; }
.admin-wa-btn:hover { background: rgba(37,211,102,.25); }
.admin-wa-btn i { font-size: 16px; }
.admin-phone-none { flex: 1; text-align: center; color: #596170; font-size: 11px; padding: 10px; background: #101319; border: 1px dashed rgba(255,255,255,.08); border-radius: 10px; }
/* ===== Cobro / recordatorio ===== */
.admin-billing { background: #101319; border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.admin-billing-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.admin-billing-row label { color: #7b9c99; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.admin-billing-row input, .admin-billing-row select { height: 32px; border: 1px solid rgba(18,216,196,.2); background: #171a21; color: #fff; border-radius: 8px; padding: 0 8px; font-family: 'Poppins', sans-serif; font-size: 12px; outline: none; color-scheme: dark; }
.admin-billing-row input { flex: 1; min-width: 120px; }
.admin-billing-row select { flex: 1; min-width: 100px; }
.admin-billing-actions { display: flex; gap: 8px; }
.admin-mini-btn { flex: 1; height: 34px; border-radius: 9px; border: 1px solid rgba(18,216,196,.35); background: rgba(18,216,196,.10); color: #12d8c4; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .2s; }
.admin-mini-btn:hover { background: rgba(18,216,196,.22); }
.admin-mini-btn.alt { border-color: rgba(255,184,76,.4); background: rgba(255,184,76,.10); color: #ffcf7d; }
.admin-mini-btn.alt:hover { background: rgba(255,184,76,.22); }
.admin-billing small { color: #596170; font-size: 10px; }
.admin-billing small b { color: #ffcf7d; }
/* ===== Modal propio (alertas independientes) ===== */
.admin-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; z-index: 9999998; padding: 16px; }
.admin-modal { width: 100%; max-width: 440px; background: #171a21; border: 1px solid rgba(18,216,196,.3); border-radius: 16px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.admin-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.admin-modal-head h3 { font-size: 15px; font-weight: 600; color: #fff; }
.admin-modal-close { background: transparent; border: 0; color: #7b9c99; font-size: 18px; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; flex-shrink: 0; }
.admin-modal-close:hover { background: rgba(255,255,255,.06); color: #fff; }
.admin-modal-body { color: #c9d6d4; font-size: 12.5px; line-height: 1.6; display: flex; flex-direction: column; gap: 10px; }
.admin-modal-body input, .admin-modal-body textarea { width: 100%; border: 1px solid rgba(18,216,196,.25); background: #101319; color: #fff; border-radius: 10px; padding: 10px 12px; font-family: 'Poppins', sans-serif; font-size: 13px; outline: none; resize: vertical; }
.admin-modal-body input:focus, .admin-modal-body textarea:focus { border-color: #12d8c4; }

.admin-modal-foot { display: flex; gap: 8px; margin-top: 16px; }
.admin-modal-btn { flex: 1; height: 42px; border-radius: 11px; border: 1px solid rgba(18,216,196,.4); background: rgba(18,216,196,.14); color: #12d8c4; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: .2s; }
.admin-modal-btn:hover { background: rgba(18,216,196,.26); }
.admin-modal-btn.cancel { border-color: rgba(255,255,255,.12); background: transparent; color: #7b9c99; }

.admin-modal-btn.danger:hover { background: rgba(255,94,94,.26); }
</style>
</head>
<body>
<div class="admin-container">
    <header class="admin-header">
        <div class="admin-brand">
            <div class="admin-logo">JK</div>
            <div>
                <h2>Panel de Comercios</h2>
                <span>Vista exclusiva · comercios registrados</span>
            </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="admin-btn" onclick="abrirModalMensaje()"><i class="fa-brands fa-whatsapp"></i> Mensaje WhatsApp</button>
            <button type="button" class="admin-btn" id="adminRefresh" onclick="recargar()"><i class="fa-solid fa-rotate"></i> Actualizar</button>
        </div>
    </header>
    <div class="admin-warn">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Panel administrativo exclusivo. Mostra datos sensibles (usuarios, contraseñas, etc.). No lo compartas ni lo publiques públicamente.</span>
    </div>
    <div class="admin-summary" id="adminSummary"></div>
    <div class="admin-stats-panel" id="adminStatsPanel">
        <div class="admin-loading" style="padding:16px"><i class="fa-solid fa-circle-notch"></i><p style="margin-top:8px">Cargando estadísticas...</p></div>
    </div>
    <div class="admin-toolbar">
        <div class="admin-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="adminSearch" placeholder="Buscar por nombre, ID o contraseña..." oninput="renderComercios()"></div>
    </div>
    <div class="admin-grid" id="adminGrid">
        <div class="admin-loading"><i class="fa-solid fa-circle-notch"></i><p style="margin-top:10px">Cargando comercios...</p></div>
    </div>
    <div class="admin-foot" id="adminFoot">—</div>
</div>
<div class="admin-modal-overlay" id="adminModalOverlay" onclick="if(event.target===this) cerrarModal()">
    <div class="admin-modal">
        <div class="admin-modal-head">
            <h3 id="adminModalTitle">—</h3>
            <button type="button" class="admin-modal-close" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="admin-modal-body" id="adminModalBody"></div>
        <div class="admin-modal-foot" id="adminModalFoot"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   PANEL DE COMERCIOS — vista exclusiva
   ===================================================================== */
window.adminSupabase = window.adminSupabase || window.supabase.createClient(
    "https://omwbjbmodqybbogyafkz.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9td2JqYm1vZHF5YmJvZ3lhZmt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMzUxNjgsImV4cCI6MjExMDgxMTE2OH0.F6Bl0k74aZ_fCIBkLIXHEDzDly_mMVpRfjIUj_vvQEI"
);
const sg = window.adminSupabase;
let comercios = [];
let operaciones = [];
const adminState = { bloqueando: null };
async function cargar() {
    mostrarCargando();
    const foot = document.getElementById('adminFoot');
    try {
        const [comerciosRes, opsRes] = await Promise.all([
            sg.from('comercio').select('*').order('created_at', { ascending: false }),
            sg.from('operaciones').select('id, comercio_id, total, tipo_operacion, created_at').limit(20000)
        ]);
        if (comerciosRes.error) throw comerciosRes.error;
        comercios = comerciosRes.data || [];
        if (opsRes.error) { console.warn('operaciones:', opsRes.error); operaciones = []; }
        else { operaciones = opsRes.data || []; }
        renderResumen();
        renderEstadisticas();
        renderComercios();
        const now = new Date().toLocaleString('es-CO');
        foot.innerHTML = 'Actualizado a ' + now + ' · ' + comercios.length + ' comercio(s) en la base de datos';
    } catch (e) {
        foot.innerHTML = 'Error al cargar: ' + e.message;
        mostrarToastError('Error: ' + e.message);
    }
}
function renderResumen() {
    const total = comercios.length;
    const blocked = comercios.filter(c => c.bloqueado).length;
    const active = total - blocked;
    const ops = operaciones.length;
    document.getElementById('adminSummary').innerHTML = `
        <div class="admin-kpi"><span>Comercios</span><strong>${total}</strong><small>en la plataforma</small></div>
        <div class="admin-kpi k-active"><span>Activos</span><strong>${active}</strong><small>en servicio</small></div>
        <div class="admin-kpi k-blocked"><span>Bloqueados</span><strong>${blocked}</strong><small>en pausa</small></div>
        <div class="admin-kpi"><span>Operaciones</span><strong>${ops}</strong><small>total en plataforma</small></div>
    `;
}
function renderEstadisticas() {
    const panel = document.getElementById('adminStatsPanel');
    if (!panel) return;
    const totalIngresos = operaciones.reduce((s, o) => s + (Number(o.total) || 0), 0);
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const hace7 = new Date(hoy); hace7.setDate(hace7.getDate() - 6);
    const hace30 = new Date(hoy); hace30.setDate(hace30.getDate() - 29);
    let ops7 = 0, ops30 = 0;
    const porDia = {}, porTipo = {}, porComercio = {};
    operaciones.forEach(o => {
        const d = new Date(o.created_at);
        if (!isNaN(d.getTime())) {
            if (d >= hace7) ops7++;
            if (d >= hace30) ops30++;
            const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            porDia[key] = (porDia[key] || 0) + 1;
        }
        const tipo = o.tipo_operacion || 'Sin tipo';
        porTipo[tipo] = (porTipo[tipo] || 0) + 1;
        porComercio[o.comercio_id] = (porComercio[o.comercio_id] || 0) + 1;
    });
    const ticket = operaciones.length ? totalIngresos / operaciones.length : 0;
    let topId = null, topN = 0;
    Object.keys(porComercio).forEach(k => { if (porComercio[k] > topN) { topN = porComercio[k]; topId = k; } });
    const topComercio = comercios.find(c => String(c.id) === String(topId));
    const dias = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date(hoy); d.setDate(d.getDate() - i);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        dias.push({ label: d.toLocaleDateString('es-CO', { weekday: 'short' }).replace('.', ''), n: porDia[key] || 0 });
    }
    const maxDia = Math.max(1, ...dias.map(d => d.n));
    const chartHtml = dias.map(d =>
        '<div class="admin-chart-col"><span>' + d.n + '</span><div class="admin-chart-bar" style="height:' + Math.max(3, Math.round((d.n / maxDia) * 48)) + 'px"></div><small>' + d.label + '</small></div>'
    ).join('');
    const tipos = Object.entries(porTipo).sort((a, b) => b[1] - a[1]);
    const tiposHtml = tipos.length
        ? tipos.map(([t, n]) => '<span class="admin-type-chip">' + t + ' · <b>' + n + '</b></span>').join('')
        : '<span class="admin-type-chip">Sin operaciones registradas</span>';
    panel.innerHTML = `
        <div class="admin-stats-head">
            <h3><i class="fa-solid fa-chart-line"></i> Estadísticas de la plataforma</h3>
            <span>Uso general del sistema que administras</span>
        </div>
        <div class="admin-stats-grid">
            <div class="admin-stat-item"><span>Ingresos totales</span><strong>${formatoMoneda(totalIngresos)}</strong></div>
            <div class="admin-stat-item"><span>Operaciones · 7 días</span><strong>${ops7}</strong></div>
            <div class="admin-stat-item"><span>Operaciones · 30 días</span><strong>${ops30}</strong></div>
            <div class="admin-stat-item"><span>Ticket promedio</span><strong>${formatoMoneda(ticket)}</strong></div>
            <div class="admin-stat-item"><span>Comercio líder</span><strong>${topComercio ? (topComercio.name || '—') : '—'}</strong><small>${topN} operaciones</small></div>
            <div class="admin-stat-item"><span>Tipos de operación</span><strong>${tipos.length}</strong><small>categorías activas</small></div>
            <div class="admin-stat-item"><span>Comercios activos</span><strong>${comercios.filter(c => !c.bloqueado).length}</strong><small>de ${comercios.length} registrados</small></div>
            <div class="admin-stat-item"><span>Operaciones totales</span><strong>${operaciones.length}</strong><small>en la plataforma</small></div>
        </div>
        <div class="admin-chart-title">Operaciones por día · últimos 7 días</div>
        <div class="admin-chart">${chartHtml}</div>
        <div class="admin-chart-title">Operaciones por tipo</div>
        <div class="admin-types-row">${tiposHtml}</div>
    `;
}
function renderComercios() {
    const grid = document.getElementById('adminGrid');
    const q = (document.getElementById('adminSearch').value || '').trim().toLowerCase();
    const lista = comercios.filter(c => !q ||
        (c.name || '').toLowerCase().includes(q) ||
        (c.id || '').toLowerCase().includes(q) ||
        (c.password || '').toLowerCase().includes(q)
    );
    if (lista.length === 0) {
        grid.innerHTML = '<div class="admin-empty"><i class="fa-solid fa-store"></i><p>No hay comercios que coincidan con la búsqueda.</p></div>';
        return;
    }
    let html = '';
    lista.forEach(c => {
        const ops = operaciones.filter(o => o.comercio_id === c.id);
        const total = ops.reduce((s, o) => s + (Number(o.total) || 0), 0);
        const inicial = (c.name || 'C').trim().charAt(0).toUpperCase();
        const logoHtml = c.logo_url
            ? '<img src="' + c.logo_url + '" alt="Logo">'
            : '<span>' + inicial + '</span>';
        const creado = c.created_at ? new Date(c.created_at).toLocaleString('es-CO') : '—';
        const actualizado = c.updated_at ? new Date(c.updated_at).toLocaleString('es-CO') : '—';
        const bloqueado = !!c.bloqueado;
        const idAttr = String(c.id).replace(/'/g, '\\&#39;');
        const safeId = String(c.id).replace(/[^a-zA-Z0-9]/g, '_');
        const telefono = obtenerTelefono(c);
        const fechaInicioVal = String(obtenerFechaInicio(c) || '').slice(0, 10);
        const freqVal = obtenerFrecuencia(c);
        const proximo = calcularProximoCobro(fechaInicioVal, freqVal);
        const proximoTxt = proximo ? proximo.toLocaleDateString('es-CO') : '—';
        html += `
        <div class="admin-card">
            <div class="admin-card-head">
                <div class="admin-logo">${logoHtml}</div>
                <div class="admin-card-title">
                    <strong>${c.name || '(sin nombre)'}</strong>
                    <small>ID: ${c.id || '—'}</small>
                    <span class="admin-status ${bloqueado ? 'blocked' : 'active'}">${bloqueado ? 'Bloqueado' : 'Activo'}</span>
                </div>
            </div>
            <div class="admin-stats">
                <div class="admin-stat"><span>Operaciones</span><strong>${ops.length}</strong></div>
                <div class="admin-stat"><span>Total registrado</span><strong>${formatoMoneda(total)}</strong></div>
            </div>
            <div class="admin-password-row">
                <input type="password" class="admin-pass-input" id="pass-${safeId}" value="${(c.password || '').replace(/"/g, '&quot;')}" readonly>
                <button type="button" class="admin-eye" title="Mostrar contraseña" onclick="togglePassword('${idAttr}', this)"><i class="fa-solid fa-eye"></i></button>
                <button type="button" class="admin-eye" title="Cambiar contraseña" onclick="abrirModalPassword('${idAttr}')"><i class="fa-solid fa-pen"></i></button>
            </div>
            <div class="admin-phone-row">
                ${telefono
                    ? `<button type="button" class="admin-wa-btn" onclick="abrirWhatsApp('${idAttr}')"><i class="fa-brands fa-whatsapp"></i> ${telefono}</button>`
                    : `<span class="admin-phone-none"><i class="fa-solid fa-phone"></i> Sin teléfono registrado</span>`}
            </div>
            <div class="admin-billing">
                <div class="admin-billing-row">
                    <label>Inicio</label>
                    <input type="date" id="fecha-${safeId}" value="${fechaInicioVal}">
                    <label>Cobro</label>
                    <select id="freq-${safeId}">
                        <option value="1"${freqVal === 1 ? ' selected' : ''}>Mensual</option>
                        <option value="3"${freqVal === 3 ? ' selected' : ''}>Trimestral</option>
                        <option value="6"${freqVal === 6 ? ' selected' : ''}>Semestral</option>
                        <option value="12"${freqVal === 12 ? ' selected' : ''}>Anual</option>
                    </select>
                </div>
                <div class="admin-billing-actions">
                    <button type="button" class="admin-mini-btn" onclick="guardarCobro('${idAttr}')"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    <button type="button" class="admin-mini-btn alt" onclick="recordarCobro('${idAttr}')"><i class="fa-solid fa-calendar-plus"></i> Recordar cobro</button>
                </div>
                <small>Próximo cobro: <b>${proximoTxt}</b></small>
            </div>
            <div class="admin-meta">
                <small>Creado: ${creado}</small>
                <small>Actualizado: ${actualizado}</small>
            </div>
            <button type="button" class="admin-block-btn ${bloqueado ? 'unblock' : 'block'}" onclick="toggleBloque('${idAttr}', ${bloqueado ? 'true' : 'false'})">
                <i class="fa-solid ${bloqueado ? 'fa-unlock' : 'fa-lock'}"></i> ${bloqueado ? 'Desbloquear servicio' : 'Bloquear servicio'}
            </button>
        </div>`;
    });
    grid.innerHTML = html;
}
function togglePassword(id, btn) {
    const input = document.getElementById('pass-' + String(id).replace(/[^a-zA-Z0-9]/g, '_'));
    if (!input) return;
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
    } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
    }
}
function formatoMoneda(num) {
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(num) || 0);
}
async function toggleBloque(id, bloqueado) {
    if (adminState.bloqueando) return;
    const nuevoEstado = !bloqueado;
    const c = comercios.find(x => String(x.id) === String(id));
    const nombre = c && c.name ? c.name : id;
    mostrarConfirm(
        nuevoEstado ? 'Bloquear servicio' : 'Desbloquear servicio',
        '¿' + (nuevoEstado ? 'Bloquear' : 'Desbloquear') + ' el servicio del comercio "' + nombre + '"?',
        nuevoEstado ? 'Bloquear' : 'Desbloquear',
        nuevoEstado ? 'danger' : '',
        async () => {
            adminState.bloqueando = id;
            try {
                const { error } = await sg.from('comercio').update({ bloqueado: nuevoEstado, updated_at: new Date().toISOString() }).eq('id', id);
                if (error) throw error;
                mostrarToastExito('Servicio ' + (nuevoEstado ? 'bloqueado' : 'desbloqueado') + ' correctamente.');
                await cargar();
            } catch (e) {
                mostrarToastError('Error: ' + e.message);
            } finally {
                adminState.bloqueando = null;
            }
        }
    );
}
/* =====================================================================
   MODAL PROPIO — alertas y confirmaciones independientes (sin dominio)
   ===================================================================== */
let confirmCallback = null;
function abrirModal(titulo, bodyHtml, footHtml) {
    document.getElementById('adminModalTitle').innerHTML = titulo;
    document.getElementById('adminModalBody').innerHTML = bodyHtml;
    document.getElementById('adminModalFoot').innerHTML = footHtml || '';
    document.getElementById('adminModalOverlay').style.display = 'flex';
}
function cerrarModal() {
    document.getElementById('adminModalOverlay').style.display = 'none';
    confirmCallback = null;
}
function mostrarConfirm(titulo, mensaje, textoBoton, clase, callback) {
    confirmCallback = callback;
    abrirModal(titulo, '<p>' + mensaje + '</p>', `
        <button type="button" class="admin-modal-btn cancel" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="admin-modal-btn ${clase || ''}" onclick="ejecutarConfirm()">${textoBoton}</button>
    `);
}
function ejecutarConfirm() {
    const cb = confirmCallback;
    cerrarModal();
    if (cb) cb();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
/* =====================================================================
   1. CAMBIAR CONTRASEÑA DE CADA COMERCIO
   ===================================================================== */
function abrirModalPassword(id) {
    const c = comercios.find(x => String(x.id) === String(id));
    const nombre = c && c.name ? c.name : id;
    abrirModal('Cambiar contraseña', `
        <p>Escribe la nueva contraseña para <b>${nombre}</b>. Esta reemplaza la actual de inmediato.</p>
        <input type="text" id="newPassInput" placeholder="Nueva contraseña" autocomplete="off">
    `, `
        <button type="button" class="admin-modal-btn cancel" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="admin-modal-btn" onclick="guardarPassword('${String(id).replace(/'/g, '\\&#39;')}')">Guardar contraseña</button>
    `);
    setTimeout(() => { const i = document.getElementById('newPassInput'); if (i) i.focus(); }, 50);
}
async function guardarPassword(id) {
    const input = document.getElementById('newPassInput');
    const nueva = input ? input.value.trim() : '';
    if (!nueva) { mostrarToastError('Escribe una contraseña para guardar.'); return; }
    try {
        const { error } = await sg.from('comercio').update({ password: nueva, updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        cerrarModal();
        mostrarToastExito('Contraseña actualizada correctamente.');
        await cargar();
    } catch (e) {
        mostrarToastError('Error: ' + e.message);
    }
}
/* =====================================================================
   7 y 8. TELÉFONO / WHATSAPP + MENSAJE PREDETERMINADO
   ===================================================================== */
const WA_MSG_KEY = 'jk_whatsapp_msg';
const WA_MSG_DEFAULT = 'Hola {nombre}, te contactamos desde el equipo JK. ¿En qué podemos ayudarte hoy?';
function obtenerMensajeWA() {
    return localStorage.getItem(WA_MSG_KEY) || WA_MSG_DEFAULT;
}
function abrirModalMensaje() {
    abrirModal('Mensaje predeterminado de WhatsApp', `
        <p>Este mensaje se enviará automáticamente al presionar el botón de WhatsApp de cada comercio. Usa <b>{nombre}</b> para insertar el nombre del comercio y <b>{id}</b> para su ID.</p>
        <textarea id="waMsgInput" rows="5">${obtenerMensajeWA()}</textarea>
    `, `
        <button type="button" class="admin-modal-btn cancel" onclick="cerrarModal()">Cancelar</button>
        <button type="button" class="admin-modal-btn" onclick="guardarMensajeWA()">Guardar mensaje</button>
    `);
}
function guardarMensajeWA() {
    const input = document.getElementById('waMsgInput');
    const val = input ? input.value.trim() : '';
    if (!val) { mostrarToastError('El mensaje no puede estar vacío.'); return; }
    localStorage.setItem(WA_MSG_KEY, val);
    cerrarModal();
    mostrarToastExito('Mensaje de WhatsApp guardado.');
}
function obtenerTelefono(c) {
    if (!c) return '';
    return c.telefono || c.phone || c.whatsapp || c.celular || c.numero || c.numero_telefono || c.telefono_contacto || '';
}
function abrirWhatsApp(id) {
    const c = comercios.find(x => String(x.id) === String(id));
    if (!c) return;
    let tel = String(obtenerTelefono(c) || '').replace(/\D/g, '');
    if (!tel) { mostrarToastError('Este comercio no tiene teléfono registrado.'); return; }
    if (tel.length <= 10) tel = '57' + tel;
    const msg = obtenerMensajeWA()
        .replace(/\{nombre\}/gi, c.name || '')
        .replace(/\{id\}/gi, c.id || '');
    window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(msg), '_blank');
}
/* =====================================================================
   3. FECHA DE INICIO + FRECUENCIA DE COBRO + RECORDATORIO DE CALENDARIO
   ===================================================================== */
function obtenerCobroLocal(id) {
    try { return JSON.parse(localStorage.getItem('jk_cobro_' + id) || 'null'); } catch (e) { return null; }
}
function obtenerFechaInicio(c) {
    if (!c) return '';
    const local = obtenerCobroLocal(c.id);
    return c.fecha_inicio || (local && local.fecha_inicio) || c.created_at || '';
}
function obtenerFrecuencia(c) {
    if (!c) return 1;
    const local = obtenerCobroLocal(c.id);
    return Number(c.frecuencia_cobro || (local && local.frecuencia_cobro) || 1);
}
function calcularProximoCobro(fechaInicio, meses) {
    if (!fechaInicio) return null;
    const d = new Date(String(fechaInicio).slice(0, 10) + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    let guard = 0;
    while (d < hoy && guard < 2400) { d.setMonth(d.getMonth() + meses); guard++; }
    return d;
}
async function guardarCobro(id) {
    const safe = String(id).replace(/[^a-zA-Z0-9]/g, '_');
    const fechaEl = document.getElementById('fecha-' + safe);
    const freqEl = document.getElementById('freq-' + safe);
    const fecha = fechaEl ? fechaEl.value : '';
    const freq = freqEl ? Number(freqEl.value) : 1;
    if (!fecha) { mostrarToastError('Selecciona la fecha de inicio del comercio.'); return; }
    try {
        const { error } = await sg.from('comercio').update({ fecha_inicio: fecha, frecuencia_cobro: freq, updated_at: new Date().toISOString() }).eq('id', id);
        if (error) throw error;
        mostrarToastExito('Fecha de inicio y frecuencia de cobro guardadas.');
        await cargar();
    } catch (e) {
        localStorage.setItem('jk_cobro_' + id, JSON.stringify({ fecha_inicio: fecha, frecuencia_cobro: freq }));
        mostrarToastError('Guardado local. La base de datos aún no tiene las columnas fecha_inicio / frecuencia_cobro.');
        await cargar();
    }
}
function recordarCobro(id) {
    const c = comercios.find(x => String(x.id) === String(id));
    if (!c) { mostrarToastError('Comercio no encontrado.'); return; }
    const fechaInicio = obtenerFechaInicio(c);
    const freq = obtenerFrecuencia(c);
    const proximo = calcularProximoCobro(fechaInicio, freq);
    if (!proximo) { mostrarToastError('Define primero la fecha de inicio del comercio.'); return; }
    const freqLabel = { 1: 'mensual', 3: 'trimestral', 6: 'semestral', 12: 'anual' }[freq] || 'mensual';
    const pad = n => String(n).padStart(2, '0');
    const fmtFecha = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const inicio = new Date(proximo); inicio.setHours(9, 0, 0, 0);
    const fin = new Date(proximo); fin.setHours(10, 0, 0, 0);
    const dates = fmtFecha(inicio) + 'T' + pad(inicio.getHours()) + pad(inicio.getMinutes()) + '00/' + fmtFecha(fin) + 'T' + pad(fin.getHours()) + pad(fin.getMinutes()) + '00';
    const texto = encodeURIComponent('Cobro ' + freqLabel + ' — ' + (c.name || 'Comercio'));
    const detalles = encodeURIComponent('Recordatorio de cobro ' + freqLabel + ' al comercio ' + (c.name || '') + ' (ID: ' + (c.id || '') + '). Inicio del servicio: ' + String(fechaInicio || '').slice(0, 10) + '.');
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + texto + '&dates=' + dates + '&details=' + detalles, '_blank');
}
/* =====================================================================
   TOASTS (sin cambios)
   ===================================================================== */
function mostrarToastExito(mensaje) { mostrarToast(mensaje, false); }
function mostrarToastError(mensaje) { mostrarToast(mensaje, true); }
function mostrarToast(mensaje, error) {
    document.querySelectorAll('.admin-alert-container').forEach(a => a.remove());
    const t = document.createElement('div');
    t.className = 'admin-alert-container' + (error ? ' error' : '');
    t.innerHTML = '<i class="fa-solid ' + (error ? 'fa-circle-xmark' : 'fa-circle-check') + '"></i><p>' + mensaje + '</p>';
    document.body.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3500);
}
function mostrarCargando() {
    document.getElementById('adminGrid').innerHTML = '<div class="admin-loading"><i class="fa-solid fa-circle-notch"></i><p style="margin-top:10px">Cargando comercios...</p></div>';
}
function recargar() { cargar(); }
document.addEventListener('DOMContentLoaded', cargar);
</script>
